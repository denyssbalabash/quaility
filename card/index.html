<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Valentyn Balabash · Quaility</title>
<meta name="theme-color" content="#f6f3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quaility">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* One screen, shown from the owner's phone: logo, photo, name, then a QR the other person scans. Colours from the logo. */
:root{
  --paper:#f6f3ea;
  --green:#2d5a2c;
  --ink:#1f3f1f;
  --gold:#c9ad5c;
  --mute:#5d6658;
  --display:"Marcellus",Georgia,serif;
  --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.4 var(--body);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding:max(12px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
html{height:100dvh}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}

main{height:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:space-evenly;gap:2svh}

.logo{display:block;height:min(18svh,210px);width:auto;max-width:74%;object-fit:contain;flex:none}

.person{display:flex;flex-direction:column;align-items:center}
.photo{width:min(92px,10.5svh);height:min(92px,10.5svh);border-radius:50%;margin-bottom:1.4svh;position:relative;overflow:hidden;
  background:#ece6d6;box-shadow:0 0 0 1px var(--gold),0 0 0 5px var(--paper),0 0 0 6px rgba(201,173,92,.45)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo span{position:absolute;inset:0;display:grid;place-items:center;font:400 1.7rem/1 var(--display);letter-spacing:.06em;color:var(--green)}
.name{margin:0;font:400 clamp(1.5rem,3.9svh,2rem)/1.1 var(--display);letter-spacing:.035em}
.role{margin:.6svh 0 0;color:var(--mute);font-size:.98rem;letter-spacing:.02em}

.qrwrap{display:flex;flex-direction:column;align-items:center;gap:1.5svh;width:100%}
.qr{width:min(78vw,310px,38svh);aspect-ratio:1;background:#fff;border-radius:22px;padding:min(16px,1.8svh);flex:none;
  box-shadow:0 0 0 1px rgba(45,90,44,.1),0 24px 48px -28px rgba(31,63,31,.45)}
.qr svg{display:block;width:100%;height:100%}
.hint{margin:0;color:var(--mute);font-size:.92rem;min-height:1.3em}

.seg{display:grid;grid-template-columns:repeat(2,1fr);width:100%;max-width:260px;background:#ebe6d7;border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:var(--mute);font:500 .95rem/1 var(--body);min-height:42px;border-radius:10px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(31,63,31,.12)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="Quaility" width="2037" height="1290">

  <div class="person">
    <div class="photo" id="photoBox" hidden><img id="photo" src="photo.jpg" alt=""></div>
    <h1 class="name">Valentyn Balabash</h1>
    <p class="role">Founder &amp; CEO</p>
  </div>

  <div class="qrwrap">
    <div class="qr" id="qr" role="img"></div>
    <p class="hint" id="hint"></p>
    <div class="seg" role="group" aria-label="QR code">
      <button type="button" data-k="contact" aria-pressed="true">Contact</button>
      <button type="button" data-k="wa" aria-pressed="false">WhatsApp</button>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const VCARD="https://denyssbalabash.github.io/quaility/vb.vcf";
const Q={
  contact:{d:VCARD,h:"Scan to save the contact"},
  wa:{d:"https://wa.me/380730537357",h:"Scan to start a WhatsApp chat"}
};
function draw(k){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));
  document.getElementById("hint").textContent=Q[k].h;
  const box=document.getElementById("qr");box.setAttribute("aria-label",Q[k].h);
  if(!window.qrcode)return;
  try{qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"]}catch(e){}
  const c=qrcode(0,"L");c.addData(Q[k].d,"Byte");c.make();
  const n=c.getModuleCount();let p="";
  for(let r=0;r<n;r++)for(let x=0;x<n;x++)if(c.isDark(r,x))p+=`M${x} ${r}h1v1h-1z`;
  box.innerHTML=`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${p}" fill="#1f3f1f"/></svg>`;
  try{localStorage.setItem("q-card",k)}catch(e){}
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>draw(b.dataset.k));
let start="contact";try{const s=localStorage.getItem("q-card");if(Q[s])start=s}catch(e){}
draw(start);
/* photo.jpg next to this page replaces the initials */
const ph=document.getElementById("photo");
const pb=document.getElementById("photoBox");
ph.onload=()=>{pb.hidden=false};ph.onerror=()=>pb.remove();
if(ph.complete&&ph.naturalWidth)pb.hidden=false;
</script>
</body>
</html>
