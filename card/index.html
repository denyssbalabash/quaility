<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Valentyn Balabash · Quaility</title>
<meta name="description" content="Valentyn Balabash, Founder & CEO of Quaility. Odesa, Ukraine.">
<meta name="theme-color" content="#f6f3ea">
<meta property="og:title" content="Valentyn Balabash, Quaility">
<meta property="og:description" content="Founder & CEO. Save the contact in one tap.">
<meta property="og:image" content="https://denyssbalabash.github.io/quaility/card/logo.png">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: one card the size of the phone screen. Front: logo, name, actions. Back: a QR that holds the full contact. Brand colours taken from the logo. */
:root{
  --paper:#f6f3ea;     /* card stock */
  --paper-2:#ece7d9;
  --green:#2d5a2c;     /* logo green */
  --green-ink:#1f3f1f;
  --gold:#b8994a;      /* logo gold, darkened for text contrast */
  --gold-line:#c9ad5c;
  --mute:#5d6658;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper-2);color:var(--green-ink);font:400 1rem/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  display:grid;place-items:center}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

.scene{width:100%;max-width:420px;perspective:1600px}
.card{position:relative;width:100%;min-height:min(760px,calc(100svh - 32px));transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.9,.25,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  display:flex;flex-direction:column;padding:36px 28px 26px;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 30px 60px -30px rgba(31,63,31,.35),0 2px 6px rgba(31,63,31,.08)}
.front{background:var(--paper)}
.front::after{content:"";position:absolute;inset:10px;border:1px solid rgba(201,173,92,.55);border-radius:20px;pointer-events:none}
.back{background:var(--green);color:var(--paper);transform:rotateY(180deg);align-items:center;text-align:center;justify-content:center}
.back::after{content:"";position:absolute;inset:10px;border:1px solid rgba(201,173,92,.5);border-radius:20px;pointer-events:none}

.logo{display:block;width:86%;max-width:320px;margin:10px auto 34px}
.rule{height:1px;margin:28px auto 26px;width:64%;background:linear-gradient(90deg,transparent,var(--gold-line),transparent)}
[hidden]{display:none!important}
.photo{margin-top:28px!important;width:84px;height:84px;border-radius:50%;object-fit:cover;margin:0 auto 16px;display:block;border:2px solid var(--gold-line)}
.name{margin:0;text-align:center;font:400 2.1rem/1.1 var(--display);letter-spacing:.04em;color:var(--green-ink);text-wrap:balance}
.role{margin:8px 0 0;text-align:center;color:var(--mute);font-size:1rem;letter-spacing:.02em}
.place{margin:4px 0 0;text-align:center;color:var(--mute);font-size:.95rem}

.acts{margin-top:auto;padding-top:28px;display:grid;gap:10px;position:relative;z-index:1}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:16px;border:0;cursor:pointer;text-decoration:none;
  font:600 1rem/1 var(--body);transition:transform .15s ease,background .2s ease}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.primary{background:var(--green);color:var(--paper)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soft{background:#fff;color:var(--green-ink);border:1px solid rgba(45,90,44,.14)}
.qrbtn{background:none;color:var(--green);font-weight:500;min-height:44px}
.note{min-height:1.3em;margin:2px 0 0;text-align:center;font-size:.85rem;color:var(--mute)}

.back h2{margin:0;font:400 1.6rem/1.15 var(--display);letter-spacing:.04em;position:relative;z-index:1}
.back p{margin:10px auto 0;max-width:26ch;color:rgba(246,243,234,.78);font-size:.95rem;position:relative;z-index:1}
.qr{width:min(78%,280px);aspect-ratio:1;margin:26px auto 22px;background:var(--paper);border-radius:22px;padding:16px;position:relative;z-index:1}
.qr svg{display:block;width:100%;height:100%}
.tabs{display:inline-flex;background:rgba(0,0,0,.18);border-radius:999px;padding:4px;gap:2px;position:relative;z-index:1}
.tabs button{border:0;background:none;color:rgba(246,243,234,.8);font:500 .88rem/1 var(--body);padding:10px 16px;border-radius:999px;cursor:pointer;min-height:40px}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--green-ink)}
.back .btn{margin-top:22px;background:none;color:var(--paper);font-weight:500;position:relative;z-index:1;min-height:44px}

@media (prefers-reduced-motion:reduce){.card{transition:none}}
@media (max-height:680px){.face{padding-top:24px}.rule{margin:18px auto}.logo{width:64%}}
</style>
</head>
<body>
<main class="scene">
  <div class="card" id="card">

    <section class="face front" aria-label="Business card">
      <img class="logo" src="logo-full.svg" alt="Quaility. Benefit of Nature, Quality of the Future" width="2037" height="1574">
      <img class="photo" id="photo" src="photo.jpg" alt="Valentyn Balabash" hidden>
      <h1 class="name">Valentyn Balabash</h1>
      <p class="role">Founder &amp; CEO</p>
      <p class="place">Odesa, Ukraine</p>

      <div class="acts">
        <a class="btn primary" id="save" href="valentyn-balabash.vcf" download="Valentyn Balabash.vcf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M3 20c0-3.3 3.1-6 7-6"/><path d="M18 14v6M15 17h6"/></svg>
          Save contact
        </a>
        <div class="row">
          <a class="btn soft" id="wa" href="https://wa.me/380730537357?text=Hello%20Valentyn%2C%20we%20met%20at%20the%20fair." target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
            WhatsApp
          </a>
          <a class="btn soft" href="tel:+380730537357">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h3l2 5-2.5 1.5a11 11 0 0 0 7 7L16 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2Z"/></svg>
            Call
          </a>
        </div>
        <button class="btn qrbtn" id="toQR" type="button">Show QR code</button>
        <p class="note" id="note" role="status"></p>
      </div>
    </section>

    <section class="face back" aria-label="QR code">
      <h2 id="qrTitle">Scan to save the contact</h2>
      <p id="qrText">Open the camera and point it at the code. No app needed.</p>
      <div class="qr" id="qr" role="img" aria-label="QR code"></div>
      <div class="tabs" role="group" aria-label="QR content">
        <button type="button" id="tContact" aria-pressed="true">Contact</button>
        <button type="button" id="tWa" aria-pressed="false">WhatsApp</button>
        <button type="button" id="tSite" aria-pressed="false">Website</button>
      </div>
      <button class="btn" id="toFront" type="button">Back to card</button>
    </section>

  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const P = {
  first:"Valentyn", last:"Balabash", title:"Founder & CEO", org:"Quaility",
  phone:"+380730537357", city:"Odesa", country:"Ukraine",
  email:"",                                   // add when ready
  site:"https://denyssbalabash.github.io/quaility/",
  card:"https://denyssbalabash.github.io/quaility/card/"
};
const VCARD=[
  "BEGIN:VCARD","VERSION:3.0",
  `N:${P.last};${P.first};;;`,`FN:${P.first} ${P.last}`,
  `ORG:${P.org}`,`TITLE:${P.title}`,
  `TEL;TYPE=CELL,VOICE:${P.phone}`,
  P.email?`EMAIL;TYPE=WORK:${P.email}`:"",
  `ADR;TYPE=WORK:;;;${P.city};;;${P.country}`,
  `URL:${P.site}`,
  "END:VCARD"].filter(Boolean).join("\r\n");
const QRS={
  contact:{data:VCARD,title:"Scan to save the contact",text:"Open the camera and point it at the code. No app needed."},
  wa:{data:"https://wa.me/380730537357",title:"Scan to message on WhatsApp",text:"Opens a chat with Valentyn."},
  site:{data:P.site,title:"Scan to open the website",text:"Quaility. Ukraine. Opening soon."}
};
const $=s=>document.querySelector(s);

function draw(key){
  const box=$("#qr"),q=QRS[key];
  $("#qrTitle").textContent=q.title;$("#qrText").textContent=q.text;
  ["contact","wa","site"].forEach(k=>$("#t"+(k==="contact"?"Contact":k==="wa"?"Wa":"Site")).setAttribute("aria-pressed",String(k===key)));
  if(!window.qrcode){box.textContent="";return}
  try{qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"]}catch(e){}
  const c=qrcode(0,"M");c.addData(q.data,"Byte");c.make();
  const n=c.getModuleCount();let d="";
  for(let r=0;r<n;r++)for(let x=0;x<n;x++)if(c.isDark(r,x))d+=`M${x} ${r}h1v1h-1z`;
  box.innerHTML=`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#1f3f1f"/></svg>`;
  box.setAttribute("aria-label",q.title);
}
$("#tContact").onclick=()=>draw("contact");
$("#tWa").onclick=()=>draw("wa");
$("#tSite").onclick=()=>draw("site");
$("#toQR").onclick=()=>{$("#card").classList.add("flipped");setTimeout(()=>$("#toFront").focus({preventScroll:true}),400)};
$("#toFront").onclick=()=>{$("#card").classList.remove("flipped");setTimeout(()=>$("#toQR").focus({preventScroll:true}),400)};
draw("contact");

/* the photo appears only once photo.jpg is uploaded next to this page */
const ph=$("#photo");ph.onload=()=>{ph.hidden=false};ph.onerror=()=>ph.remove();if(ph.complete&&ph.naturalWidth)ph.hidden=false;
</script>
</body>
</html>
