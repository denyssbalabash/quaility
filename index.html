<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0c0b">
<meta name="description" content="Quaility. The largest quail egg factory in Europe. Ukraine. Opening soon.">
<meta property="og:title" content="Quaility">
<meta property="og:description" content="Welcome to the largest quail egg factory in Europe.">
<meta property="og:url" content="https://denyssbalabash.github.io/quaility/">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quaility</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: one pinned film (egg, conveyor, blister) with three short captions, then the name lockup, then a digital business card. Single dark world by choice. */
:root{
  --ink:#0d0c0b;
  --ink-2:#161412;
  --line:rgba(239,233,218,.1);
  --shell:#efe9da;
  --mute:#9a9184;
  --sage:#b6d1c8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Onest","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{background:var(--ink);color:var(--shell);font:400 1.0625rem/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:clip}
:focus-visible{outline:2px solid var(--sage);outline-offset:3px;border-radius:6px}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;width:100%}

header{position:fixed;left:0;right:0;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);pointer-events:none}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px}
.mark{font-weight:600;font-size:1.05rem;letter-spacing:-.02em}
.mark i{font-style:normal;color:var(--mute)}
.lang{pointer-events:auto;display:flex;gap:2px}
.lang button{font:500 .8rem/1 var(--font);color:var(--mute);background:none;border:0;padding:10px 10px;cursor:pointer;min-width:44px;min-height:44px}
.lang button[aria-pressed="true"]{color:var(--shell)}

/* ---------- film ---------- */
#story{position:relative;height:640svh}
.sticky{position:sticky;top:0;height:100svh;overflow:hidden;
  background:radial-gradient(70% 55% at 50% 38%,#1c1916 0%,#110f0e 55%,var(--ink) 100%)}
#gl{position:absolute;inset:0}
#gl canvas{display:block;width:100%;height:100%}
.caps{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-end}
.caps::before{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(to top,rgba(13,12,11,.92),rgba(13,12,11,0))}
.cap{position:absolute;left:0;right:0;bottom:0;padding-bottom:max(7svh,calc(env(safe-area-inset-bottom,0px) + 28px));}
.c0{padding-bottom:max(15svh,calc(env(safe-area-inset-bottom,0px) + 104px));will-change:opacity,transform}
.cap h1,.cap h2{margin:0;font-weight:600;letter-spacing:-.045em;line-height:1;text-wrap:balance}
.cap h1{font-size:clamp(2.5rem,10vw,6rem);max-width:12ch}
.cap h2{font-size:clamp(2.1rem,8vw,4.4rem);max-width:13ch}
.cap p{margin:16px 0 0;color:var(--mute);font-size:1.05rem;max-width:34ch}
.c1,.c2{opacity:0}
.scroll{position:absolute;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 12px));transform:translateX(-50%);z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;color:var(--shell);font:500 .8125rem/1 var(--font);cursor:pointer;padding:8px 14px;min-height:44px}
.scroll .pill{width:24px;height:38px;border:1.5px solid rgba(239,233,218,.55);border-radius:13px;position:relative}
.scroll .pill::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:8px;margin-left:-1.5px;border-radius:2px;background:var(--shell);animation:wheel 1.8s cubic-bezier(.6,0,.3,1) infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:0}25%{opacity:1}70%{transform:translateY(12px);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.scroll .pill::after{animation:none;opacity:1}}

/* ---------- word morphs (name + AI) ---------- */
.pinned{position:relative}
#name{height:330svh}
#ai{height:300svh}
.pinned .sticky{background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stage{position:relative;width:100%;display:flex;justify-content:center}
.stack{display:grid;justify-items:center;gap:0;flex:none;transform-origin:50% 50%;will-change:transform}
.row{position:relative;display:flex;white-space:nowrap;font-weight:700;font-size:10rem;line-height:1.2;letter-spacing:-.045em}
.row span{display:inline-block;flex:none;overflow:hidden;will-change:width,opacity,filter}
.row.main span{color:transparent;-webkit-background-clip:text;background-clip:text;background-repeat:no-repeat;
  background-image:linear-gradient(100deg,var(--shell) 0%,var(--shell) 46%,#ffffff 50%,var(--sage) 52%,var(--shell) 56%,var(--shell) 100%)}
.row.ghost{position:absolute;left:50%;top:0;transform:translateX(-50%);color:rgba(239,233,218,.34);opacity:0}
.row.ghost .gap{color:transparent}
.row.ai span{color:var(--shell)}
.row.ai span.x{color:var(--sage)}
.captions{position:relative;height:3.4em;margin-top:clamp(20px,5svh,48px);width:100%;max-width:34ch}
.captions p{position:absolute;inset:0;margin:0;color:var(--mute);font-size:1.0625rem;opacity:0}
.captions p b{color:var(--shell);font-weight:600}
#ai .captions{height:7em}
#name .captions{margin-top:clamp(72px,14svh,140px)}
.over{margin:0 0 clamp(16px,4svh,36px);font-size:1.0625rem;color:var(--mute);opacity:0}

/* ---------- card ---------- */
.contact{padding-block:18svh 12svh;display:grid;justify-items:center;gap:28px;text-align:center}
.contact h2{margin:0;font-weight:600;letter-spacing:-.045em;line-height:1;font-size:clamp(2.2rem,8vw,4.2rem);text-wrap:balance;max-width:14ch}
.card{width:100%;max-width:560px;border-radius:28px;padding:22px;text-align:left;
  background:linear-gradient(155deg,#1d1a17,#121110 60%);border:1px solid var(--line);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(239,233,218,.06);
  display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.who .org{font-size:.85rem;color:var(--mute)}
.who .nm{margin:6px 0 0;font-size:1.6rem;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.who .tt{margin:4px 0 0;color:var(--mute);font-size:.95rem}
.lines{display:grid;gap:6px;margin-top:18px;font-size:.98rem}
.lines span{user-select:all;word-break:break-all}
.ph{color:var(--mute);border-bottom:1px dashed rgba(141,133,121,.6)}
.qr{background:var(--shell);border-radius:18px;padding:14px;justify-self:center;width:min(100%,240px);aspect-ratio:1}
.qr svg{display:block;width:100%;height:100%}
.qrcap{margin:0;color:var(--mute);font-size:.9rem}

footer .wrap{display:flex;justify-content:space-between;gap:8px;padding-block:22px 28px;font-size:.82rem;color:var(--mute);border-top:1px solid var(--line)}

@media (min-width:760px){
  .card{grid-template-columns:minmax(0,1fr) 220px;align-items:center;padding:30px}
  .qr{width:220px}
}
</style>
</head>
<body>


<header class="gut"><div class="wrap bar">
  <div class="mark" aria-label="Quaility">Quail<i>ity</i></div>
  <div class="lang" role="group" aria-label="Language">
    <button id="l-en" type="button" data-lang="en" aria-pressed="true">EN</button>
    <button id="l-uk" type="button" data-lang="uk" aria-pressed="false">UA</button>
  </div>
</div></header>

<main>
  <section id="story">
    <div class="sticky">
      <div id="gl" aria-hidden="true"></div>
      <div class="caps gut">
        <button class="scroll" id="scrollCue" type="button"><span class="pill" aria-hidden="true"></span><span data-t="cue"></span></button>
        <div class="cap c0 gut"><div class="wrap"><h1 data-t="h1"></h1><p data-t="s0"></p></div></div>
        <div class="cap c1 gut"><div class="wrap"><h2 data-t="h2a"></h2><p data-t="s1"></p></div></div>
        <div class="cap c2 gut"><div class="wrap"><h2 data-t="h2b"></h2><p data-t="s2"></p></div></div>
      </div>
    </div>
  </section>

  <section id="name" class="pinned">
    <div class="sticky gut">
      <div class="stage" role="img" aria-label="Quail + Quality = Quaility">
        <div class="stack" id="mStack" aria-hidden="true">
          <div class="row ghost" id="mTop"></div>
          <div class="row main" id="mMain"></div>
          <div class="row ghost" id="mBot"></div>
        </div>
      </div>
      <div class="captions" aria-live="off">
        <p id="mc0"></p><p id="mc1"></p><p id="mc2"></p>
      </div>
    </div>
  </section>

  <section id="ai" class="pinned">
    <div class="sticky gut">
      <p class="over" id="aiOver" data-t="aiOver"></p>
      <div class="stage" role="img" aria-label="AI: Autosexing Inherited">
        <div class="stack" id="aStack" aria-hidden="true"><div class="row ai" id="aRow"></div></div>
      </div>
      <div class="captions"><p id="aiCap"></p></div>
    </div>
  </section>

  <section class="contact gut">
    <h2 data-t="cH"></h2>
    <div class="card">
      <div class="who">
        <div class="org">Quaility</div>
        <p class="nm" id="cName"></p>
        <p class="tt" id="cTitle"></p>
        <div class="lines" id="cLines"></div>
      </div>
      <div class="qr" id="qr" role="img"></div>
    </div>
    <p class="qrcap" data-t="qrCap"></p>
  </section>
</main>

<footer class="gut"><div class="wrap"><span>© 2026</span><span data-t="foot"></span></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ===== Owner's card. Fill in before the fair; the QR adds this person to the phone's contacts. ===== */
const OWNER = {
  first: "Valentyn", last: "Balabash",          // Latin spelling, e.g. as on a passport
  title: "Founder & CEO",
  phone: "+380730537357",
  email: "quaility.co@gmail.com",
  site:  "https://denyssbalabash.github.io/quaility/"   // replace with the domain when it exists
};

const T={
 en:{h1:"Welcome to the largest quail egg factory in Europe",s0:"Ukraine. Opening soon.",cue:"Scroll",
   h2a:"One line, egg to blister",s1:"Checked, sorted and packed in one flow.",
   h2b:"Sealed on the line",s2:"Built to supply Europe.",
   m0:"<b>Quail</b> is the bird.",m1:"<b>Quality</b> is the standard.",m2:"<b>Quaility</b> is both, in one word.",aiOver:"Powered by AI.",aiCap:"Genetic autosexing. Hens and cockerels differ in down colour from the day they hatch, so every flock is sorted from day one.",cH:"Let's talk supply",qrCap:"Point your phone camera at the code to save the contact.",
   ph:{name:"Owner name",phone:"Phone",email:"Email"},foot:"Ukraine. Opening soon."},
 uk:{h1:"Ласкаво просимо на найбільшу фабрику перепелиних яєць у Європі",s0:"Україна. Відкриття скоро.",cue:"Гортайте",
   h2a:"Одна лінія від яйця до блістера",s1:"Перевірка, сортування й пакування в одному потоці.",
   h2b:"Запаковано на лінії",s2:"Збудовано, щоб постачати Європу.",
   m0:"<b>Quail</b> означає перепілку.",m1:"<b>Quality</b> означає якість.",m2:"<b>Quaility</b> поєднує обидва слова.",aiOver:"Працює на AI.",aiCap:"Генетичний аутосексинг. Курочки й півники відрізняються кольором пуху з дня вилуплення, тож кожне стадо відсортоване з першого дня.",cH:"Поговорімо про поставки",qrCap:"Наведіть камеру телефону на код, щоб зберегти контакт.",
   ph:{name:"Ім'я власника",phone:"Телефон",email:"Email"},foot:"Україна. Відкриття скоро."}
};
let lang="en";try{const s=localStorage.getItem("q-lang");if(T[s])lang=s}catch(e){}
const $=s=>document.querySelector(s);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function vcard(){
  const o=OWNER,L=["BEGIN:VCARD","VERSION:3.0"];
  if(o.first||o.last){L.push(`N:${o.last};${o.first};;;`,`FN:${[o.first,o.last].filter(Boolean).join(" ")}`)}else{L.push("N:;Quaility;;;","FN:Quaility")}
  L.push("ORG:Quaility");
  if(o.title)L.push("TITLE:"+o.title);
  if(o.phone)L.push("TEL;TYPE=CELL:"+o.phone);
  if(o.email)L.push("EMAIL;TYPE=WORK:"+o.email);
  if(o.site)L.push("URL:"+o.site);
  L.push("END:VCARD");return L.join("\r\n");
}
function drawQR(){
  const box=$("#qr");box.setAttribute("aria-label","QR code: save contact");
  if(!window.qrcode){box.textContent="";return}
  try{qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"]}catch(e){}
  const q=qrcode(0,"M");q.addData(vcard(),"Byte");q.make();
  const n=q.getModuleCount();let d="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;
  box.innerHTML=`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#0d0c0b"/></svg>`;
}
function renderCard(){
  const o=OWNER,ph=T[lang].ph,nm=$("#cName"),tt=$("#cTitle"),ln=$("#cLines");
  const full=[o.first,o.last].filter(Boolean).join(" ");
  nm.innerHTML=full?"":`<span class="ph">${ph.name}</span>`;if(full)nm.textContent=full;
  tt.textContent=o.title;tt.hidden=!o.title;
  ln.innerHTML="";
  [[o.phone,ph.phone],[o.email,ph.email]].forEach(([v,p])=>{const s=document.createElement("span");if(v)s.textContent=v;else{s.className="ph";s.textContent=p}ln.appendChild(s)});
  if(o.site){const s=document.createElement("span");s.textContent=o.site.replace(/^https?:\/\//,"");ln.appendChild(s)}
}
function apply(){
  document.documentElement.lang=lang==="uk"?"uk":"en";
  document.querySelectorAll("[data-t]").forEach(n=>{const v=T[lang][n.dataset.t];if(typeof v==="string")n.textContent=v});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  renderCard();
  ["m0","m1","m2"].forEach((k,i)=>{const e=document.getElementById("mc"+i);if(e)e.innerHTML=T[lang][k]});
  const ac=document.getElementById("aiCap");if(ac)ac.textContent=T[lang].aiCap;
  if(window.measureMorphs)measureMorphs();
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("q-lang",lang)}catch(e){}apply()}));
apply();drawQR();
$("#scrollCue").addEventListener("click",()=>scrollTo({top:innerHeight*1.1,behavior:reduce?"auto":"smooth"}));

/* ===== word morphs =====
   Quaility holds both words: drop letter 4 and it reads Quality, drop the last three and it reads Quail. */
const WORD=["Q","u","a","i","l","i","t","y"];
const M_A=[1,1,1,1,1,0,0,0], M_B=[1,1,1,0,1,1,1,1];
const AI_CH=["A","utosexing","\u00a0","I","nherited"], AI_M=[1,0,0,1,0];
const mm={nat:[],ai:[]};
function row(el,chars,mask,cls){el.innerHTML="";chars.forEach((c,i)=>{const s=document.createElement("span");s.textContent=c;if(mask&&!mask[i])s.className="gap";if(cls&&cls[i])s.classList.add(cls[i]);el.appendChild(s)})}
row($("#mTop"),WORD,M_A);row($("#mMain"),WORD);row($("#mBot"),WORD,M_B);
row($("#aRow"),AI_CH,null,["","x","","","x"]);
window.measureMorphs=function(){
  const m=[...$("#mMain").children],a=[...$("#aRow").children];
  [...m,...a].forEach(s=>s.style.width="");
  mm.nat=m.map(s=>s.offsetWidth);mm.ai=a.map(s=>s.offsetWidth);
  mm.full=mm.nat.reduce((x,y)=>x+y,0);mm.aiFull=mm.ai.reduce((x,y)=>x+y,0);
  if(window.morphFrame)morphFrame(pinP(nameSec),pinP(aiSec));
};
const blur=v=>reduce||v>=.999?"none":`blur(${((1-v)*14).toFixed(1)}px)`;
window.morphFrame=function(pn,pa){
  if(!mm.full)return;
  const cw=nameSec.clientWidth-40,vh=innerHeight;
  /* name: Quail -> Quality -> Quaility, then the two source words lift out of it */
  const st=ss(.16,.32,pn)+ss(.46,.62,pn), intro=ss(0,.1,pn);
  const spans=[...$("#mMain").children];let x=0;
  const W=mm.full,hx=-.25*W+1.5*W*ss(.64,.82,pn);
  spans.forEach((s,i)=>{
    const v=st<=1?M_A[i]+(M_B[i]-M_A[i])*st:M_B[i]+(1-M_B[i])*(st-1);
    s.style.width=(mm.nat[i]*v).toFixed(2)+"px";
    const o=v*intro;s.style.opacity=o.toFixed(3);s.style.filter=blur(Math.min(v,intro));
    s.style.backgroundSize=`${3*W}px 100%`;s.style.backgroundPosition=`${(hx-1.5*W-x).toFixed(1)}px 0`;
    x+=mm.nat[i]*v;
  });
  const sc=Math.min(1.25,cw*.9/W,vh*.32/160);
  $("#mStack").style.transform=`scale(${(sc*(1.06-.06*ss(0,.14,pn))).toFixed(4)})`;
  const g=ss(.76,.9,pn);
  $("#mTop").style.opacity=(g*.9).toFixed(3);$("#mBot").style.opacity=(g*.9).toFixed(3);
  $("#mTop").style.transform=`translate(-50%,${(-g*100).toFixed(1)}%)`;
  $("#mBot").style.transform=`translate(-50%,${(g*100).toFixed(1)}%)`;
  const cv=[bell(pn,.03,.09,.18,.24),bell(pn,.34,.4,.5,.56),ss(.66,.72,pn)];
  cv.forEach((v,i)=>{const e=$("#mc"+i);e.style.opacity=v.toFixed(3);e.style.transform=`translateY(${((1-v)*10).toFixed(1)}px)`});
  /* AI: two letters open into the words they stand for */
  const ai=[...$("#aRow").children],k=ease(ss(.36,.6,pa)),ain=ss(0,.12,pa);let cur=0;
  ai.forEach((s,i)=>{const v=AI_M[i]+(1-AI_M[i])*k;s.style.width=(mm.ai[i]*v).toFixed(2)+"px";
    const o=(AI_M[i]?ain:v);s.style.opacity=o.toFixed(3);s.style.filter=blur(AI_M[i]?ain:v);cur+=mm.ai[i]*v});
  const target=cw*(.46+.46*k),asc=Math.min(target/Math.max(cur,1),vh*.42/160);
  $("#aStack").style.transform=`scale(${asc.toFixed(4)})`;
  const ov=bell(pa,.04,.12,.3,.36),$o=$("#aiOver");$o.style.opacity=ov.toFixed(3);$o.style.transform=`translateY(${((1-ov)*10).toFixed(1)}px)`;
  const ac=ss(.62,.7,pa),$c=$("#aiCap");$c.style.opacity=ac.toFixed(3);$c.style.transform=`translateY(${((1-ac)*10).toFixed(1)}px)`;
};

/* ===== scroll helpers ===== */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const bell=(p,a,b,c,d)=>ss(a,b,p)*(1-ss(c,d,p));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function pinP(el){const r=el.getBoundingClientRect();return clamp(-r.top/Math.max(1,r.height-innerHeight))}
const story=$("#story"),nameSec=$("#name"),aiSec=$("#ai");
const c0=$(".c0"),c1=$(".c1"),c2=$(".c2");
let P=0;
function onScroll(){
  P=pinP(story);
  const a=1-ss(.05,.12,P),b=bell(P,.3,.36,.55,.61),c=ss(.86,.92,P);
  c0.style.opacity=a;{const q=1-ss(.01,.05,P),e=$("#scrollCue");e.style.opacity=q;e.style.pointerEvents=q<.1?"none":"auto"}c0.style.transform=`translateY(${(1-a)*-24}px)`;
  c1.style.opacity=b;c1.style.transform=`translateY(${(1-b)*18}px)`;
  c2.style.opacity=c;c2.style.transform=`translateY(${(1-c)*18}px)`;
  if(window.morphFrame)morphFrame(pinP(nameSec),pinP(aiSec));
}
addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",()=>{measureMorphs();onScroll()});
measureMorphs();onScroll();
try{document.fonts.ready.then(()=>{measureMorphs();onScroll()})}catch(e){}

/* ===== the film ===== */
(function(){
  const host=$("#gl");
  if(!window.THREE)return;
  let R;try{R=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"})}catch(e){return}
  if(!R.getContext())return;
  const mobile=Math.min(innerWidth,innerHeight)<700;
  R.setPixelRatio(Math.min(devicePixelRatio||1,mobile?1.75:2));
  R.setClearColor(0,0);
  R.outputEncoding=THREE.sRGBEncoding;
  R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
  R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
  host.appendChild(R.domElement);

  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(32,1,.05,100);

  /* studio environment: a dark room with two soft boxes, for calm reflections */
  const pm=new THREE.PMREMGenerator(R);
  const env=new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(20,32,16),new THREE.MeshBasicMaterial({color:0x15130f,side:THREE.BackSide})));
  const sb=(w,h,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);env.add(m)};
  sb(10,6,0xfff4e6,-4,10,6);sb(3,9,0x9aa6a1,10,3,-2);sb(6,2,0x6a5c50,0,-2,10);
  scene.environment=pm.fromScene(env,.04).texture;

  const key=new THREE.DirectionalLight(0xfff1df,2.1);key.position.set(-3,7,5);
  key.castShadow=true;key.shadow.mapSize.set(mobile?1024:2048,mobile?1024:2048);
  Object.assign(key.shadow.camera,{left:-9,right:9,top:6,bottom:-6,near:1,far:30});key.shadow.radius=6;key.shadow.bias=-.0004;
  scene.add(key,key.target);
  scene.add(new THREE.HemisphereLight(0xfff6e8,0x1a1612,.35));

  const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,30),new THREE.ShadowMaterial({opacity:.5}));
  floor.rotation.x=-Math.PI/2;floor.position.y=-.32;floor.receiveShadow=true;scene.add(floor);

  /* ---- egg: Hügelschäffer profile, painted shell ---- */
  function eggGeo(seg){
    const pts=[],L=1,B=.79,w=.075;
    for(let i=0;i<=seg;i++){const y=-L/2+L*i/seg;const r=(B/2)*Math.sqrt(Math.max(0,(L*L-4*y*y)/(L*L+8*w*y+4*w*w)));pts.push(new THREE.Vector2(Math.max(r,1e-4),y))}
    const g=new THREE.LatheGeometry(pts,96);g.computeVertexNormals();g.scale(.62,.62,.62);return g;
  }
  const EGG=eggGeo(90),HALF=.31;
  function rnd(s){return()=>{s=Math.sin(s)*10000;return s-Math.floor(s)}}
  function shellTex(seed){
    const W=1024,H=512,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");const r=rnd(seed);
    const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,"#d6cdb2");grd.addColorStop(.5,"#dcd3ba");grd.addColorStop(1,"#cfc7ad");g.fillStyle=grd;g.fillRect(0,0,W,H);
    const wrapDraw=(fn,x)=>{fn(x);if(x<80)fn(x+W);if(x>W-80)fn(x-W)};
    for(let i=0;i<14;i++){const x=r()*W,y=r()*H,rad=40+r()*110;wrapDraw(xx=>{const gg=g.createRadialGradient(xx,y,0,xx,y,rad);gg.addColorStop(0,"rgba(180,200,190,.35)");gg.addColorStop(1,"rgba(180,200,190,0)");g.fillStyle=gg;g.fillRect(xx-rad,y-rad,rad*2,rad*2)},x)}
    for(let i=0;i<5000;i++){const x=r()*W,y=r()*H;g.fillStyle=r()<.5?"rgba(120,100,70,.06)":"rgba(255,250,235,.07)";g.fillRect(x,y,1+r()*2,1+r()*2)}
    const blob=(x,y,s,a)=>{const n=4+Math.floor(r()*9);
      for(let k=0;k<n;k++){const ox=x+(r()-.5)*s*2.2,oy=y+(r()-.5)*s*1.6,rx=s*(.35+r()*.7),ry=rx*(.6+r()*.6),rot=r()*3;
        wrapDraw(xx=>{g.save();g.translate(xx,oy);g.rotate(rot);g.beginPath();g.ellipse(0,0,rx*1.35,ry*1.35,0,0,6.283);g.fillStyle=`rgba(112,82,58,${.18*a})`;g.fill();
          g.beginPath();g.ellipse(0,0,rx,ry,0,0,6.283);const t=r();g.fillStyle=`rgba(${38+t*30|0},${26+t*20|0},${18+t*12|0},${.92*a})`;g.fill();g.restore()},ox)}};
    const nb=18+Math.floor(r()*10);for(let i=0;i<nb;i++)blob(r()*W,40+r()*(H-80),6+r()*20,.75+r()*.25);
    for(let i=0;i<700;i++){const x=r()*W,y=r()*H,s=.6+r()*2.6;wrapDraw(xx=>{g.beginPath();g.arc(xx,y,s,0,6.283);g.fillStyle=`rgba(40,28,20,${.5+r()*.45})`;g.fill()},x)}
    const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=R.capabilities.getMaxAnisotropy();return t;
  }
  const bump=(()=>{const c=document.createElement("canvas");c.width=512;c.height=256;const g=c.getContext("2d");const d=g.createImageData(512,256);const r=rnd(7);for(let i=0;i<d.data.length;i+=4){const v=118+r()*20|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return new THREE.CanvasTexture(c)})();
  const maps=[shellTex(3.1),shellTex(11.7),shellTex(29.3)];
  const SAGE=new THREE.Color(0xb6d1c8);
  function eggMat(i){return new THREE.MeshPhysicalMaterial({map:maps[i%3],bumpMap:bump,bumpScale:.0025,roughness:.58,metalness:0,clearcoat:.18,clearcoatRoughness:.55,emissive:SAGE,emissiveIntensity:0,envMapIntensity:.9})}

  const N=10,eggs=[];
  for(let i=0;i<N;i++){const m=new THREE.Mesh(EGG,eggMat(i));m.castShadow=true;m.rotation.y=i*1.7;scene.add(m);eggs.push(m)}

  /* ---- conveyor ---- */
  const conv=new THREE.Group();scene.add(conv);
  const fadeMats=[];const fm=m=>{m.transparent=true;m.userData.o=m.opacity;fadeMats.push(m);return m};
  const X0=-7.4,X1=2.0,LEN=X1-X0,CX=(X0+X1)/2;
  const body=new THREE.Mesh(new THREE.BoxGeometry(LEN,.28,1.02),fm(new THREE.MeshStandardMaterial({color:0x1d1b19,roughness:.42,metalness:.35})));
  body.position.set(CX,-.17,0);body.receiveShadow=true;body.castShadow=true;conv.add(body);
  const beltCanvas=(()=>{const c=document.createElement("canvas");c.width=256;c.height=32;const g=c.getContext("2d");g.fillStyle="#141312";g.fillRect(0,0,256,32);g.fillStyle="#1d1b19";for(let x=0;x<256;x+=32)g.fillRect(x,0,3,32);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(LEN/1.0,1);t.encoding=THREE.sRGBEncoding;return t})();
  const belt=new THREE.Mesh(new THREE.BoxGeometry(LEN,.02,.86),fm(new THREE.MeshStandardMaterial({map:beltCanvas,roughness:.85,metalness:0})));
  belt.position.set(CX,-.01,0);belt.receiveShadow=true;conv.add(belt);
  const steel=fm(new THREE.MeshStandardMaterial({color:0xb9b4ab,roughness:.22,metalness:1}));
  [-1,1].forEach(s=>{const r=new THREE.Mesh(new THREE.BoxGeometry(LEN,.07,.025),steel);r.position.set(CX,.035,s*.47);r.castShadow=true;conv.add(r)});
  [X0,X1].forEach(x=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,1.02,40),fm(new THREE.MeshStandardMaterial({color:0x1d1b19,roughness:.4,metalness:.35})));c.rotation.x=Math.PI/2;c.position.set(x,-.17,0);conv.add(c)});
  // AI scanner arch
  const SX=-1.6;
  const arch=new THREE.Group();arch.position.x=SX;conv.add(arch);
  [-1,1].forEach(s=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.06,1.05,.06),steel);p.position.set(0,.2,s*.62);p.castShadow=true;arch.add(p)});
  const beam=new THREE.Mesh(new THREE.BoxGeometry(.09,.07,1.3),steel);beam.position.y=.72;arch.add(beam);
  const strip=new THREE.Mesh(new THREE.BoxGeometry(.03,.012,1.12),fm(new THREE.MeshBasicMaterial({color:0xcfe6de})));strip.position.y=.68;arch.add(strip);
  const sheetTex=(()=>{const c=document.createElement("canvas");c.width=4;c.height=128;const g=c.getContext("2d");const gr=g.createLinearGradient(0,0,0,128);gr.addColorStop(0,"rgba(182,209,200,.9)");gr.addColorStop(1,"rgba(182,209,200,0)");g.fillStyle=gr;g.fillRect(0,0,4,128);return new THREE.CanvasTexture(c)})();
  const sheetMat=fm(new THREE.MeshBasicMaterial({map:sheetTex,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  const sheet=new THREE.Mesh(new THREE.PlaneGeometry(1.12,.68),sheetMat);sheet.rotation.y=Math.PI/2;sheet.position.y=.34;arch.add(sheet);

  /* ---- blister ---- */
  const BX=3.95;
  const cav=[];for(let c=0;c<5;c++)for(let r=0;r<2;r++)cav.push(new THREE.Vector3(BX-1.2+c*.6,0,(r?.3:-.3)));
  const order=[];for(let i=0;i<N;i++){const c=4-Math.floor(i/2),r=i%2;order.push(cav[c*2+r])}
  const pet=()=>fm(new THREE.MeshPhysicalMaterial({color:0xf2f7f5,roughness:.08,metalness:0,clearcoat:1,clearcoatRoughness:.05,transparent:true,opacity:.2,side:THREE.DoubleSide,depthWrite:false,envMapIntensity:1.6}));
  function flange(withHoles){
    const s=new THREE.Shape(),x0=-1.58,x1=2.2,z0=-.72,z1=.72,rr=.12;
    s.moveTo(x0+rr,z0);s.lineTo(x1-rr,z0);s.quadraticCurveTo(x1,z0,x1,z0+rr);s.lineTo(x1,z1-rr);s.quadraticCurveTo(x1,z1,x1-rr,z1);s.lineTo(x0+rr,z1);s.quadraticCurveTo(x0,z1,x0,z1-rr);s.lineTo(x0,z0+rr);s.quadraticCurveTo(x0,z0,x0+rr,z0);
    if(withHoles)cav.forEach(v=>{const h=new THREE.Path();h.absarc(v.x-BX,v.z,.255,0,Math.PI*2,true);s.holes.push(h)});
    const g=new THREE.ShapeGeometry(s,24);g.rotateX(Math.PI/2);return g;
  }
  const base=new THREE.Group();base.position.set(BX,0,0);scene.add(base);
  const baseMat=pet();
  base.add(new THREE.Mesh(flange(true),baseMat));
  const cupG=new THREE.LatheGeometry([[.255,0],[.25,-.05],[.235,-.17],[.2,-.255],[.12,-.3],[0,-.3]].map(a=>new THREE.Vector2(a[0],a[1])),48);
  cav.forEach(v=>{const m=new THREE.Mesh(cupG,baseMat);m.position.set(v.x-BX,0,v.z);base.add(m)});
  // label under the lid
  const labelTex=(()=>{const c=document.createElement("canvas");c.width=280;c.height=560;const g=c.getContext("2d");g.fillStyle="#efe9da";g.fillRect(0,0,280,560);
    g.save();g.translate(140,280);g.rotate(-Math.PI/2);g.fillStyle="#0d0c0b";g.font="600 64px Onest, sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText("Quaility",0,-20);
    g.font="400 26px Onest, sans-serif";g.fillStyle="#6a6257";g.fillText("10 quail eggs",0,40);g.restore();
    const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t})();
  const label=new THREE.Mesh(new THREE.PlaneGeometry(.56,1.12),fm(new THREE.MeshStandardMaterial({map:labelTex,roughness:.7})));
  label.rotation.x=-Math.PI/2;label.position.set(1.83,.003,0);label.receiveShadow=true;base.add(label);
  // lid
  const lid=new THREE.Group();lid.position.set(BX,1.6,0);scene.add(lid);
  const lidMat=pet();
  lid.add(new THREE.Mesh(flange(true),lidMat));
  const domeG=new THREE.LatheGeometry([[0,.355],[.1,.35],[.19,.31],[.24,.21],[.255,.06],[.258,0]].map(a=>new THREE.Vector2(a[0],a[1])),48);
  cav.forEach(v=>{const m=new THREE.Mesh(domeG,lidMat);m.position.set(v.x-BX,.004,v.z);lid.add(m)});
  // seal line
  const sealMat=fm(new THREE.MeshBasicMaterial({color:0xcfe6de,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  const seal=new THREE.Group();seal.position.set(BX,.006,0);scene.add(seal);
  [[3.78,.012,.02,.31,-.71],[3.78,.012,.02,.31,.71],[.02,.012,1.42,-1.57,0],[.02,.012,1.42,2.19,0]].forEach(([w,h,d,x,z])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),sealMat);m.position.set(x,0,z);seal.add(m)});

  const setFade=a=>fadeMats.forEach(m=>{if(m===sealMat)return;m.opacity=m.userData.o*a;m.visible=a>.003});

  /* ---- camera path ---- */
  const HERO=new THREE.Vector3(-6.2,1.05,0);
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  // [p, camera position, look-at]
  const KEYS=[
    [0,   V(-6.2,1.35,5.6), V(-6.2,1.0,0)],
    [.12, V(-6.2,1.35,5.6), V(-6.2,1.0,0)],
    [.27, V(-4.6,2.6,5.4),  V(-4.4,.15,0)],
    [.48, V(-1.0,1.7,4.4),  V(-1.8,.25,0)],
    [.68, V(2.6,2.9,4.6),   V(3.0,.05,0)],
    [.86, V(4.6,3.4,3.9),   V(4.1,0,0)],
    [1,   V(4.1,5.0,2.2),   V(4.15,0,0)]
  ];
  const camP=V(0,0,0),camT=V(0,0,0),wantP=V(0,0,0),wantT=V(0,0,0),tmp=V(0,0,0);
  function camAt(p,wide,aspect){
    let i=0;while(i<KEYS.length-2&&p>KEYS[i+1][0])i++;
    const a=KEYS[i],b=KEYS[i+1],t=ease(clamp((p-a[0])/(b[0]-a[0])));
    wantP.lerpVectors(a[1],b[1],t);wantT.lerpVectors(a[2],b[2],t);
    // fit: pull back on narrow screens, frame the subject above the captions
    const fB=aspect<1?1+(1-aspect)*1.5:1,fH=aspect<1?1+(1-aspect)*.75:1,hw=1-ss(.1,.24,p);
    const f=fB+(fH-fB)*hw;
    tmp.subVectors(wantP,wantT).multiplyScalar(f);
    const heroW=1-ss(.1,.24,p);
    if(wide){wantT.x-=1.55*heroW;wantT.y-=.15*(1-heroW)}
    else{wantT.y-=(.62*heroW+.5*(1-heroW))}
    wantP.addVectors(wantT,tmp);
  }

  /* ---- motion along the line ---- */
  let beltVis=0;const SP=.66,HOP=1.25,DMAX=(X1-(-6.2))+HOP+(N-1)*SP+.05;
  const hopFrom=V(X1,HALF,0),pos=V(0,0,0);
  function placeEgg(i,d,heroW,time){
    const m=eggs[i],s=d-i*SP,x=-6.2+s;let sc=1;
    if(s<=X1+6.2){pos.set(x,HALF,0);m.rotation.z=0;
      sc=i===0?1:ss(X0+.1,X0+.6,x)*beltVis;
      m.material.emissiveIntensity=Math.exp(-Math.pow((x-SX)/.18,2))*.55;
    }else{
      const q=clamp((s-(X1+6.2))/HOP),e=ease(q),c=order[i];
      pos.lerpVectors(hopFrom,c,e);pos.y=HALF*(1-e)+Math.sin(Math.PI*q)*.55;
      m.rotation.z=Math.sin(Math.PI*q)*.35;m.material.emissiveIntensity=0;
    }
    if(i===0&&heroW>0){
      const k=ease(heroW);pos.lerp(HERO,k);sc=1+1.6*k;
      m.position.copy(pos);m.position.y+=reduce?0:Math.sin(time*.9)*.04*k;
    }else m.position.copy(pos);
    m.scale.setScalar(Math.max(sc,1e-4));m.visible=sc>.002;
  }

  function size(){const w=host.clientWidth,h=host.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
  new ResizeObserver(size).observe(host);size();

  let mx=0,my=0;addEventListener("pointermove",e=>{if(e.pointerType==="mouse"){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5}},{passive:true});
  let onScreen=true;new IntersectionObserver(es=>{onScreen=es[0].isIntersecting}).observe(host);
  const clock=new THREE.Clock();let time=0,first=true,spin=0,lastD=0;

  function frame(){
    requestAnimationFrame(frame);
    if(!onScreen&&!first)return;
    const dt=Math.min(clock.getDelta(),.05);time+=dt;
    const p=P,wide=host.clientWidth>=760,aspect=cam.aspect;

    const beltA=ss(.11,.24,p);setFade(beltA);beltVis=beltA;
    const heroW=1-ss(.12,.25,p);
    const d=DMAX*ease(clamp((p-.2)/(.8-.2)));
    beltCanvas.offset.x=-(d)/1.0*1;lastD=d;
    for(let i=0;i<N;i++)placeEgg(i,d,heroW,time);
    // hero egg turns slowly, others keep their own angle
    spin+=dt*(reduce?0:.35)*(heroW>0?1:.2);
    eggs[0].rotation.y=spin+mx*.6*heroW;
    eggs[0].rotation.x=my*.25*heroW;
    sheetMat.opacity=(.1+.12*(.5+.5*Math.sin(time*3)))*beltA;

    const lidK=ease(ss(.82,.91,p));lid.position.y=1.6+(0.004-1.6)*lidK;
    lidMat.opacity=.2*ss(.6,.75,p);lid.visible=lidMat.opacity>.003;
    sealMat.opacity=bell(p,.905,.925,.95,.99)*.9;

    camAt(p,wide,aspect);
    const k=first?1:Math.min(1,dt*5);first=false;
    camP.lerp(wantP,k);camT.lerp(wantT,k);
    cam.position.copy(camP);cam.lookAt(camT);
    key.target.position.copy(camT);key.position.set(camT.x-3,camT.y+7,camT.z+5);
    R.render(scene,cam);
  }
  frame();
})();
</script>
